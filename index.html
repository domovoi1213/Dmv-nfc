<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оставьте отзыв</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#4a1520;--bg2:#3a0f18;--gold:#c9a66b;--gold-soft:#e3cfa0;--ink:#f1e6d0;--muted:#cdb9a0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,var(--bg) 0%,var(--bg2) 100%) fixed;color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.page{min-height:100%;display:flex;padding:18px}
.frame{flex:1;max-width:460px;margin:0 auto;border:1px solid var(--gold);border-radius:22px;padding:36px 24px 28px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{font:700 54px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;color:var(--gold);margin:0;padding-left:.14em}
.venue{margin:6px 0 0;font:500 20px 'Cormorant Garamond',Georgia,serif;color:var(--gold-soft);letter-spacing:.04em}
.rule{width:56px;height:1px;background:var(--gold);margin:28px 0}
h1{font:700 32px/1.15 'Cormorant Garamond',Georgia,serif;margin:0 0 14px;color:var(--ink)}
.stars{font-size:28px;letter-spacing:.2em;color:var(--gold);margin:0 0 22px;padding-left:.2em}
.hint{margin:0 0 26px;color:var(--muted);font-size:15px;max-width:30ch}
.links{width:100%;display:grid;gap:12px;margin-top:auto}
.btn{display:flex;align-items:center;justify-content:center;min-height:58px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--gold);color:var(--gold-soft);background:transparent;font:700 16px Manrope,sans-serif;text-decoration:none}
.btn.main{background:var(--gold);color:var(--bg2)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--gold-soft);outline-offset:3px}
.thanks{margin:22px 0 0;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>
</head>
<body>
<div class="page"><main class="frame">
  <p class="brand" id="brand"></p>
  <p class="venue" id="venue"></p>
  <div class="rule"></div>
  <h1 id="title"></h1>
  <div class="stars" aria-hidden="true">★★★★★</div>
  <p class="hint" id="hint"></p>
  <nav class="links" id="links"></nav>
  <p class="thanks" id="thanks"></p>
</main></div>

<script>
/* ===== МЕНЯЙТЕ ТОЛЬКО ЭТОТ БЛОК ПОД КАЖДОЕ ЗАВЕДЕНИЕ ===== */
const CONFIG = {
  brand: "DMV",
  venue: "Pino Cafe",
  title: "Оставь отзыв о нашей компании",
  hint: "Выберите, где вам удобнее. Это займёт меньше минуты.",
  thanks: "Спасибо, что помогаете нам становиться лучше",
  links: [
    {label: "Отзыв в 2ГИС", url: "https://2gis.ru/krasnoyarsk/geo/70000001064278294"},
    {label: "Отзыв в Яндекс Картах", url: "https://yandex.ru/maps/org/pino/34668987470?si=4haachzmjf4f4cab5ra6r7bn64"},
    {label: "Страница ресторана", url: "https://pino.urartugroup.ru/"}
    /* ещё ссылка: {label: "Отзыв в Google", url: "https://..."} */
  ]
};
/* ===== конец настроек ===== */

const $ = id => document.getElementById(id);
document.title = CONFIG.venue + " — оставьте отзыв";
$("brand").textContent = CONFIG.brand;
$("venue").textContent = CONFIG.venue;
$("title").textContent = CONFIG.title;
$("hint").textContent = CONFIG.hint;
$("thanks").textContent = CONFIG.thanks;
CONFIG.links.forEach((l, i) => {
  const a = document.createElement("a");
  a.className = "btn" + (i === 0 ? " main" : "");
  a.textContent = l.label; a.href = l.url;
  a.target = "_blank"; a.rel = "noopener";
  $("links").append(a);
});
</script>
</body>
</html>
